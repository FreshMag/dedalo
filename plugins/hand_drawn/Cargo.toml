[package]
name = "dedalo-plugin-hand-drawn"
description = "Reference plugin: a hand-drawn look for Dedalo maps (scene pass, painter, theme)"
version = "1.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dedalo-pdk.workspace = true

# Plugins implement a WebAssembly boundary through the PDK; they do not
# inherit the workspace lints.
[lints]
