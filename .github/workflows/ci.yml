name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The golden corpus is compared byte for byte, so running the same tests on
  # three systems is what proves the output is identical across them.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  # The WebAssembly build must reproduce the bytes the native build recorded.
  wasm:
    name: wasm32 golden check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show
      - name: Build the modules and the reference plugins
        run: |
          cargo build -p dedalo-wasm -p dedalo-wasm-export -p dedalo-plugin-hand-drawn -p dedalo-plugin-uvtt --target wasm32-unknown-unknown --profile wasm --locked
          cp target/wasm32-unknown-unknown/wasm/dedalo_plugin_hand_drawn.wasm plugins/hand_drawn/hand_drawn.wasm
          cp target/wasm32-unknown-unknown/wasm/dedalo_plugin_uvtt.wasm plugins/uvtt/uvtt.wasm
          cargo run -p dedalo-cli --locked -- plugin list --plugin plugins --json > plugins/index.json
          cargo run -p dedalo-cli --locked -- plugin pack plugins/blueprint -o web/test-package.dedalopkg
          cp target/wasm32-unknown-unknown/wasm/dedalo_wasm.wasm web/dedalo.wasm
          cp target/wasm32-unknown-unknown/wasm/dedalo_wasm_export.wasm web/dedalo-export.wasm
      - name: Size budgets (spec 14.3)
        run: |
          core=$(gzip -9 -c web/dedalo.wasm | wc -c)
          export=$(gzip -9 -c web/dedalo-export.wasm | wc -c)
          echo "core module: $core bytes compressed (budget 1572864)"
          echo "export module: $export bytes compressed (budget 3145728)"
          test "$core" -le 1572864
          test "$export" -le 3145728
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compare with the golden corpus
        run: node web/golden.mjs
      - name: Build the Obsidian plugin
        run: python3 integrations/obsidian/build.py --wasm web/dedalo.wasm
      - name: Browser checks (golden corpus, editor and Obsidian plugin self-tests)
        run: |
          bash web/run-browser-check.sh golden.html
          bash web/run-browser-check.sh selftest.html
          bash web/run-browser-check.sh ../integrations/obsidian/selftest.html
