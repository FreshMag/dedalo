name: Pages

# Publishes the static site to the `gh-pages` branch (spec 14.3): the `main`
# branch deploys to /next/, tagged releases deploy to the site root. Schemas
# are served under /schema/ at versioned URLs.
#
# In the repository settings, Pages must be set to serve the `gh-pages`
# branch. The site is then at https://freshmag.github.io/dedalo/next/.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install the pinned toolchain
        run: rustup show
      - name: Build the site
        run: |
          cargo build -p dedalo-wasm -p dedalo-wasm-export -p dedalo-plugin-hand-drawn -p dedalo-plugin-uvtt --target wasm32-unknown-unknown --profile wasm --locked
          cp target/wasm32-unknown-unknown/wasm/dedalo_plugin_hand_drawn.wasm plugins/hand_drawn/hand_drawn.wasm
          cp target/wasm32-unknown-unknown/wasm/dedalo_plugin_uvtt.wasm plugins/uvtt/uvtt.wasm
          cargo build -p dedalo-cli --release --locked
          mkdir -p site/schema
          cp web/index.html web/reference.html web/style.css web/*.js web/manifest.webmanifest web/icon.svg site/
          rm -f site/golden*.js site/golden.mjs site/selftest.js site/selftest-setup.js site/selftest.html site/run-browser-check.sh site/serve.py
          mkdir -p site/docs site/examples
          cp docs/tutorial.md docs/cookbook.md docs/plugins.md docs/compatibility.md site/docs/
          for name in forgotten_crypt four_shapes rotated levels_tower; do cp tests/corpus/$name/input.dedalo site/examples/$name.dedalo; done
          cp target/wasm32-unknown-unknown/wasm/dedalo_wasm.wasm site/dedalo.wasm
          cp target/wasm32-unknown-unknown/wasm/dedalo_wasm_export.wasm site/dedalo-export.wasm
          cp spec/schema/*.json site/schema/
          ./target/release/dedalo schema document --profile authoring > site/schema/document-1.authoring.json
          ./target/release/dedalo skill export site/skill --llms-txt site/llms.txt
          # The reviewed plugin index (spec 11.6): first-party plugins and their hashes.
          mkdir -p site/plugins
          for id in blueprint hand_drawn uvtt; do
            mkdir -p site/plugins/$id
            (cd plugins/$id && find . -type f ! -path './src/*' ! -name 'Cargo.toml' -exec cp --parents {} ../../site/plugins/$id/ \;)
          done
          ./target/release/dedalo plugin list --plugin plugins --json | python3 -c "import json,sys; d=json.load(sys.stdin); [p.pop('path',None) for p in d]; print(json.dumps(d, indent=2))" > site/plugins/index.json
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
            git fetch origin gh-pages
            git worktree add published origin/gh-pages
            git -C published checkout -B gh-pages
          else
            git worktree add --detach published
            git -C published checkout --orphan gh-pages
            git -C published rm -rf --quiet .
          fi
          touch published/.nojekyll
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # A release replaces the root and keeps /next/.
            find published -mindepth 1 -maxdepth 1 ! -name .git ! -name next ! -name .nojekyll -exec rm -rf {} +
            cp -r site/. published/
          else
            rm -rf published/next
            mkdir -p published/next
            cp -r site/. published/next/
          fi
          git -C published add -A
          if git -C published diff --cached --quiet; then
            echo "nothing to publish"
          else
            git -C published commit --quiet -m "Deploy ${GITHUB_SHA}"
            git -C published push origin gh-pages
          fi
