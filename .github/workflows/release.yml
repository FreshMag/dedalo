name: Release

# Releases are automatic (semantic release). When CI passes on `main`, the
# commits since the last release decide the next version from their
# Conventional Commits prefixes:
#
#   fix: ...                     patch release, 0.1.0 -> 0.1.1
#   feat: ...                    minor release, 0.1.0 -> 0.2.0
#   feat!: ... or BREAKING CHANGE  minor release while the version is 0.x;
#                                remove the `releaseRules` line of
#                                .releaserc.json at 1.0 to make it major
#   docs:, test:, chore:, ...    no release
#
# semantic-release then sets the version in Cargo.toml, Cargo.lock and
# CHANGELOG.md, commits that as `chore(release): X.Y.Z [skip ci]`, tags it
# vX.Y.Z and opens a draft GitHub release with notes from the commits. The
# binaries for four targets are built from the tag and attached, with
# SHA-256 checksums, build-provenance attestations and the install scripts,
# and only then is the release published. Last, the site is deployed to the
# root of GitHub Pages.
#
# Binaries are not code-signed, by the decision recorded under spec 19.2.
#
# main is protected: changes arrive through pull requests that pass CI. The
# release commit and tag are pushed with the write deploy key stored as the
# RELEASE_DEPLOY_KEY secret, the one actor the ruleset lets push directly.
#
# Run by hand with a tag, for example v0.1.0, the workflow skips semantic
# release and builds, attaches and publishes that existing draft release.

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to build and publish, such as v0.1.0. Leave empty to run semantic release.
        required: false
        default: ""

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    # Only after a successful CI run of a push to main, or by hand.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ inputs.tag || steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # Pushes go through the deploy key, which the ruleset protecting
          # main lets through; GITHUB_TOKEN cannot be exempted from it.
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - name: Install the pinned toolchain
        run: rustup show
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the tag given by hand
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        run: git rev-parse --verify --quiet "refs/tags/$TAG" || { echo "no tag $TAG" >&2; exit 1; }
      - name: Start from 0.0.1
        if: inputs.tag == ''
        # Without a tag semantic-release would begin at 1.0.0. The first
        # commit is the 0.0.1 of the changelog.
        run: |
          if [ -z "$(git tag --list 'v*')" ]; then
            git tag v0.0.1 "$(git rev-list --max-parents=0 HEAD | tail -n 1)"
            git push origin v0.0.1
          fi
      - name: Release
        id: release
        if: inputs.tag == ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          before="$(git tag --list 'v*' | sort)"
          npx --yes \
            -p semantic-release@24.2.0 \
            -p @semantic-release/exec@6.0.3 \
            -p @semantic-release/git@10.0.1 \
            -p conventional-changelog-conventionalcommits@8.0.0 \
            semantic-release
          # A release adds a tag; nothing to build otherwise.
          tag="$(comm -13 <(echo "$before") <(git tag --list 'v*' | sort) | head -n 1)"
          if [ -n "$tag" ]; then
            echo "released $tag"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "no release: no fix or feat commit since the last one"
          fi

  build:
    needs: version
    if: needs.version.outputs.tag != ''
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, archive: tar.gz }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, archive: tar.gz }
          - { os: macos-latest, target: aarch64-apple-darwin, archive: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, archive: zip }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - name: Install the pinned toolchain and the target
        run: |
          rustup show
          rustup target add ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked -p dedalo-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="dedalo-${{ matrix.target }}"
          mkdir "$name"
          bin="target/${{ matrix.target }}/release/dedalo"
          [ -f "$bin.exe" ] && bin="$bin.exe"
          "$bin" --version
          cp "$bin" README.md LICENSE "$name/"
          cp crates/dedalo-scene/fonts/OFL.txt "$name/FONTS-OFL.txt"
          if [ "${{ matrix.archive }}" = zip ]; then
            7z a "$name.zip" "$name" > /dev/null
            echo "ASSET=$name.zip" >> "$GITHUB_ENV"
          else
            tar czf "$name.tar.gz" "$name"
            echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ env.ASSET }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach the binaries and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          cp scripts/install.sh scripts/install.ps1 dist/
          (cd dist && sha256sum * > SHA256SUMS)
          gh release upload "$TAG" dist/* --clobber
          {
            gh release view "$TAG" --json body --jq .body
            printf '\n---\n\nInstall with `curl -fsSL https://github.com/%s/releases/latest/download/install.sh | sh`, or on Windows `irm https://github.com/%s/releases/latest/download/install.ps1 | iex`. The editor is at https://freshmag.github.io/dedalo/.\n\nBinaries are not code-signed; verify them with SHA256SUMS or `gh attestation verify <file> --repo %s`. Language, output and plugin API changes are listed in CHANGELOG.md.\n' "$GITHUB_REPOSITORY" "$GITHUB_REPOSITORY" "$GITHUB_REPOSITORY"
          } > notes.md
          gh release edit "$TAG" --notes-file notes.md --draft=false --latest

  site:
    needs: [version, publish]
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.version.outputs.tag }}
      release: true
