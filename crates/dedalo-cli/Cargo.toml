[package]
name = "dedalo-cli"
description = "The dedalo binary: validate, format, convert, inspect and render dungeon maps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["dungeon", "map", "rpg", "dsl", "mcp"]
categories = ["command-line-utilities", "games"]

# Prebuilt binaries for `cargo binstall dedalo-cli` (spec 16.1).
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/dedalo-{ target }{ archive-suffix }"
bin-dir = "dedalo-{ target }/{ bin }{ binary-ext }"

[[bin]]
name = "dedalo"
path = "src/main.rs"

[dependencies]
dedalo-core.workspace = true
clap.workspace = true
dedalo-plugin.workspace = true
toml.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
