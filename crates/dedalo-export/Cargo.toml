[package]
name = "dedalo-export"
description = "Text map, PNG and PDF output for Dedalo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
dedalo-model.workspace = true
dedalo-geom.workspace = true
dedalo-render.workspace = true
dedalo-scene.workspace = true
resvg = { version = "0.47", default-features = false, features = ["text"], optional = true }
krilla = { version = "0.8", default-features = false, optional = true }
krilla-svg = { version = "0.8", optional = true }

[features]
default = ["raster"]
# PNG and PDF. The browser's core module leaves them out (spec 14.2).
raster = ["dep:resvg", "dep:krilla", "dep:krilla-svg"]

[lints]
workspace = true
