[plugin]
id = "uvtt"
name = "Universal VTT export"
version = "0.3.0"
api = 1
dedalo = ">=0.2"
license = "Apache-2.0"
description = "Exports a map as a Universal VTT file (.dd2vtt): the image with its walls, doors and lights."

[wasm]
module = "uvtt.wasm"

[[exporter]]
format = "dd2vtt"
extension = "dd2vtt"
media_type = "application/json"
needs = ["png"]
