<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' blob: data:">
    <title>Dedalo</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
      <h1>Dedalo</h1>
      <p>Describe a dungeon as text, get a map. Nothing leaves this page.</p>
      <label>Audience
        <select id="preset">
          <option value="dm">DM</option>
          <option value="player">Player</option>
          <option value="clean">Clean</option>
        </select>
      </label>
      <label>Rotation
        <select id="rotation">
          <option value="0">0°</option>
          <option value="90">90°</option>
          <option value="180">180°</option>
          <option value="270">270°</option>
        </select>
      </label>
      <button id="format" type="button">Format</button>
      <button id="download" type="button">Download SVG</button>
      <span id="status" role="status"></span>
    </header>
    <main>
      <section class="editor">
        <textarea id="source" spellcheck="false" aria-label="Dungeon description"></textarea>
        <ol id="problems" aria-label="Problems"></ol>
      </section>
      <section id="preview" aria-label="Map preview"></section>
    </main>
    <script type="module" src="main.js"></script>
  </body>
</html>
